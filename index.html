<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070b12">

    <title>NETHA X ADMIN</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="app">

        <section class="login-container" id="loginScreen">

            <div class="login-logo">
                NX
            </div>

            <h1>NETHA X</h1>
            <p class="subtitle">ULTIMATE ADMIN PANEL</p>

            <form id="loginForm">

                <label for="adminEmail">Email Address</label>

                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Enter admin email"
                    autocomplete="username"
                    required
                >

                <label for="adminPassword">Password</label>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" id="loginButton">
                    LOGIN TO DASHBOARD
                </button>

                <p id="loginMessage" role="alert"></p>

            </form>

            <p class="footer-text">
                NETHA X ULTIMATE
                <br>
                Secure Administration System
            </p>

        </section>

        <section id="dashboardScreen" hidden>
        </section>

    </main>

    <script type="module" src="script.js"></script>

</body>
</html>
